[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "query-verification-gates"
version = "0.1.0"
description = "Make numeric claims about a business auditable: schema, dual-path reconciliation, filter ledger and per-scope mapping gates for analytical SQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Isaque Carvalho" }]
keywords = ["sql", "data-quality", "verification", "reconciliation", "analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/1isaqu/query-verification-gates"
Repository = "https://github.com/1isaqu/query-verification-gates"
Issues = "https://github.com/1isaqu/query-verification-gates/issues"

[project.optional-dependencies]
sqlserver = ["pyodbc>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
query-gates = "query_gates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "BLE"]
ignore = ["RUF012"]
